id = "local/rclone-status"
name = "Rclone Status"
version = "1.0.0"
plugin_api = 45
author = "local"
license = "MIT"
dependencies = ["rclone"]
tags = ["cloud", "rclone", "mounts", "bar", "panel"]
icon = "cloud"
description = "Top bar rclone mount/remote status indicator with dropdown controls and quick Rclone Control launch."

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"
# Entries of the bar's native Pin/Unpin menu (suite/tray-drawer-unpinned-widgets.patch), on the
# bar and in the tray drawer; plain actions, so they work while the icon is unpinned.
menu = [
  { label = "Open rclone GUI", action = "exec noctalia-rclone-status open-gui" },
]

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = "content"
max_height = 680
placement = "attached"
position = "top_right"
open_near_click = true
