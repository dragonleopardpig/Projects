id = "local/rsync-status"
name = "Rsync Status"
version = "1.1.0"
plugin_api = 45
author = "local"
license = "MIT"
dependencies = ["rsync"]
tags = ["sync", "backup", "rsync", "bar", "panel"]
icon = "arrows-transfer-up"
description = "Top bar rsync status indicator with graphical target/exclude editor and quick Rclone Control launch."

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"
# Entries of the bar's native Pin/Unpin menu (suite/tray-drawer-unpinned-widgets.patch), on the
# bar and in the tray drawer; plain actions, so they work while the icon is unpinned.
menu = [
  { label = "Sync now", action = "exec noctalia-rsync-status trigger" },
  { label = "Show log", action = "exec noctalia-rsync-status open-log" },
]

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = "content"
max_height = 680
placement = "attached"
position = "top_right"
open_near_click = true
