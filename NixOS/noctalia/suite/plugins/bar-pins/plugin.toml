id = "local/bar-pins"
name = "Bar Pins"
version = "1.0.0"
plugin_api = 45
author = "local"
license = "MIT"
tags = ["bar", "panel"]
icon = "pinned-off"
description = "Pin / Unpin for every bar icon: right click on an icon offers its old right-click action and Unpin from bar. Unpinned icons sit in the tray's down-arrow drawer (suite/tray-drawer-unpinned-widgets.patch), where their right click offers Pin to bar."

# The menu a right click opens (settings.nix binds `panel-toggle local/bar-pins:menu <icon>`).
[[panel]]
id = "menu"
entry = "menu.luau"
width = 260
height = "content"
max_height = 320
placement = "attached"
position = "top_right"
open_near_click = true
