id = "local/backup-status"
name = "Backup Status"
version = "1.0.0"
plugin_api = 45
author = "local"
license = "MIT"
tags = ["backup", "restic", "bar", "panel"]
icon = "database"
description = "Top bar restic backup indicator (hosts/M90aPro/backup.nix): running, failed, overdue or up to date, with Run now / Stop / Browse and the daily time, retention and extra folders editable. Hidden on hosts without a backup."

[[service]]
id = "service"
entry = "service.luau"

[[widget]]
id = "bar"
entry = "bar.luau"
# Entries of the bar's native Pin/Unpin menu (suite/tray-drawer-unpinned-widgets.patch), on the
# bar and in the tray drawer; plain actions, so they work while the icon is unpinned.
menu = [
  { label = "Back up now", action = "exec backup-pool run" },
  { label = "Stop backup", action = "exec backup-pool stop" },
  { label = "Browse backups", action = "exec backup-pool browse-start" },
  { label = "Show log", action = "exec backup-pool open-log" },
]

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = "content"
max_height = 720
placement = "attached"
position = "top_right"
open_near_click = true
