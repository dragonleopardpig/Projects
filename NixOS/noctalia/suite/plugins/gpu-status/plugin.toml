id = "local/gpu-status"
name = "Active GPU & Monitor Status"
version = "1.0.0"
plugin_api = 45
author = "local"
license = "MIT"
dependencies = ["umbriel"]
tags = ["gpu", "display", "bar", "hardware", "umbriel"]
icon = "cpu"
description = "Displays the active rendering GPU and per-monitor scanout GPU."

[[widget]]
id = "bar"
entry = "bar.luau"
# Entries of the bar's native Pin/Unpin menu (suite/tray-drawer-unpinned-widgets.patch), on the
# bar and in the tray drawer; plain actions, so they work while the icon is unpinned.
menu = [
  { label = "Display settings", action = "panel-toggle prponkshe/umbriel-displays:panel" },
  { label = "Arrange displays", action = "panel-toggle prponkshe/umbriel-displays:arrange" },
]
