[package]
name = "edge-detector"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
dioxus-desktop = "0.6"
image = "0.25"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "process", "time", "io-util"] }
http = "1.4.0"

[profile.release]
opt-level = 3
lto = true
