[package]
name = "emacs-minder"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Native Emacs dynamic module for Minder (.minder and .org) mind maps"

[lib]
name = "emacs_minder"
crate-type = ["cdylib", "rlib"]

[dependencies]
flate2 = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"

[build-dependencies]
pkg-config = "0.3"
