# Runs once Enhanced Dirvish has its own repository; inside a larger
# repository this folder is inert.
name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['29.4', '30.1']
    steps:
      - uses: actions/checkout@v5
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}
      - name: Install Dirvish, optional packages and package-lint from MELPA
        run: |
          emacs -Q --batch --eval "(progn
            (require 'package)
            (add-to-list 'package-archives '(\"melpa\" . \"https://melpa.org/packages/\") t)
            (package-initialize)
            (package-refresh-contents)
            (dolist (p '(dirvish transpose-frame dashboard package-lint))
              (package-install p)))"
      - name: Byte-compile each file in its own Emacs (warnings are errors)
        run: |
          for f in $(ls enhanced-dirvish*.el | grep -v tests); do
            emacs -Q --batch --eval "(progn
              (require 'package) (package-initialize)
              (add-to-list 'load-path default-directory)
              (setq byte-compile-error-on-warn t))" -f batch-byte-compile "$f"
            rm -f *.elc
          done
      - name: package-lint
        run: |
          emacs -Q --batch --eval "(progn
            (require 'package) (package-initialize)
            (require 'package-lint)
            (setq package-lint-main-file \"enhanced-dirvish.el\"
                  package-lint-batch-fail-on-warnings nil))" \
            -f package-lint-batch-and-exit $(ls enhanced-dirvish*.el | grep -v tests)
      - name: Tests
        run: |
          rm -f *.elc
          emacs -Q --batch --eval "(progn (require 'package) (package-initialize))" \
            -l enhanced-dirvish-tests.el -f ert-run-tests-batch-and-exit
